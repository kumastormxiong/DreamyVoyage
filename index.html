<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Dreamy Voyage - Echosfall Butterchurn</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="icon" href="./favicon_circle.png">
    <link rel="stylesheet" href="./style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QKJ6LKDFCD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-QKJ6LKDFCD');
    </script>

    <!-- PWA 支持 -->
    <link rel="manifest" href="./manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('ServiceWorker 注册成功:', reg.scope))
                    .catch(err => console.log('ServiceWorker 注册失败:', err));
            });
        }
    </script>
</head>
<body>
    <!-- 核心 WebGL2 Butterchurn 画布 -->
    <canvas id="butterchurn-canvas"></canvas>

    <!-- 暗角与下部暗色渐变遮罩 -->
    <div class="vignette-radial"></div>
    <div class="vignette-bottom"></div>

    <!-- 顶部极简状态栏 -->
    <div class="top-status-bar" data-echosfall-control="true">
        <div class="brand-badge" data-echosfall-control="true">
            <span class="brand-dot"></span>
            <span class="brand-text">ECHOSFALL</span>
        </div>
        <div class="top-actions" data-echosfall-control="true">
            <button id="btn-top-catalog" class="icon-btn-pill" title="歌单目录" data-echosfall-control="true">
                <i class="fa-solid fa-bars"></i>
            </button>
            <button id="btn-top-fullscreen" class="icon-btn-pill" title="全屏沉浸" data-echosfall-control="true">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>
    </div>

    <!-- 加载缓冲旋转器 -->
    <div id="loading-indicator" class="loading-indicator hidden">
        <div class="spinner"></div>
    </div>

    <!-- 底部歌曲名称展示卡片 (对齐 Echosfall 原生规格与动画) -->
    <div id="echosfall-title-container" class="echosfall-title-container">
        <div id="echosfall-title-card" class="echosfall-title-card">
            <div id="track-name" class="track-name">载入中...</div>
            <div id="preset-name" class="preset-name">BUTTERCHURN REVERIE</div>
        </div>
    </div>

    <!-- 双击点赞/收藏脉冲粒子红心 (Echosfall 原生) -->
    <div id="heart-pop-container" class="heart-pop-container hidden">
        <div id="heart-pop-bubble" class="heart-pop-bubble">
            <i class="fa-solid fa-heart"></i>
        </div>
    </div>

    <!-- 单击暂停控制浮层 (ECHOSFALL Pause Modal) -->
    <div id="echosfall-pause-modal" class="echosfall-pause-modal hidden" data-echosfall-control="true">
        <div class="pause-content" data-echosfall-control="true">
            <div class="pause-logo-wrap" data-echosfall-control="true">
                <div class="pause-logo-glow"></div>
                <h1 class="pause-logo-text">ECHOSFALL</h1>
            </div>
            <div class="pause-buttons" data-echosfall-control="true">
                <button id="btn-resume" type="button" class="btn-pause-action btn-primary" data-echosfall-control="true">
                    <i class="fa-solid fa-play"></i>
                    <span>继续</span>
                </button>
                <button id="btn-mode-toggle" type="button" class="btn-pause-action btn-secondary" data-echosfall-control="true">
                    <i id="mode-icon" class="fa-solid fa-shuffle"></i>
                    <span id="mode-text">随机播放</span>
                </button>
                <button id="btn-open-catalog" type="button" class="btn-pause-action btn-outline-cyan" data-echosfall-control="true">
                    <i class="fa-solid fa-compact-disc"></i>
                    <span>Dreamy 歌单</span>
                </button>
                <button id="btn-toggle-favorite" type="button" class="btn-pause-action btn-outline-rose" data-echosfall-control="true">
                    <i id="favorite-status-icon" class="fa-regular fa-heart"></i>
                    <span id="favorite-status-text">收藏当前预设</span>
                </button>
                <button id="btn-next-preset" type="button" class="btn-pause-action btn-outline-purple" data-echosfall-control="true">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>换个预设 (空格键)</span>
                </button>
            </div>
            <div class="pause-hint" data-echosfall-control="true">
                上下滑动切歌 · 空格键软切换预设 (每30s自动轮播) · 双击屏幕收藏
            </div>
        </div>
    </div>

    <!-- 侧边歌曲目录抽屉 -->
    <div id="catalog-drawer-overlay" class="catalog-drawer-overlay hidden" data-echosfall-control="true"></div>
    <div id="catalog-drawer" class="catalog-drawer" data-echosfall-control="true">
        <div class="drawer-header" data-echosfall-control="true">
            <h3><i class="fa-solid fa-compact-disc"></i> 幻梦曲库 (50 首)</h3>
            <button id="btn-close-catalog" type="button" class="btn-close-drawer" data-echosfall-control="true">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="catalog-list" class="catalog-list" data-echosfall-control="true">
            <!-- 动态渲染列表 -->
        </div>
    </div>

    <!-- 进场遮罩 / 全屏解锁 AudioContext -->
    <div id="intro-overlay" data-echosfall-control="true">
        <div class="intro-content" data-echosfall-control="true">
            <h1 class="glitch-text" data-text="DREAMY VOYAGE" data-echosfall-control="true">DREAMY VOYAGE</h1>
            <div class="glow-pulse" data-echosfall-control="true"><i class="fa-solid fa-hand-point-up" data-echosfall-control="true"></i></div>
        </div>
    </div>

    <!-- 核心音频对象 -->
    <audio id="audio-core" preload="auto" playsinline webkit-playsinline></audio>

    <!-- 静态资源与逻辑依赖 -->
    <script src="./lib/butterchurn.min.js"></script>
    <script src="./presets/preset-names.js"></script>
    <script src="./presets/presets-data.js"></script>
    <script src="./song-list.js"></script>
    <script src="./main.js"></script>
</body>
</html>
