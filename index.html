<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DreamyVoyage - 幻梦之旅</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="icon" href="./favicon_circle.png">
    <link rel="stylesheet" href="./style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QKJ6LKDFCD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-QKJ6LKDFCD');
    </script>
    <!-- PWA 支持 -->
    <link rel="manifest" href="./manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('ServiceWorker 注册成功:', reg.scope))
                    .catch(err => console.log('ServiceWorker 注册失败:', err));
            });
        }
    </script>
</head>
<body>
    <!-- Shader 动态背景 Canvas -->
    <canvas id="webgl-canvas"></canvas>
    <!-- 2D 圆形音频频谱 Canvas -->
    <canvas id="spectre-canvas"></canvas>

    <!-- 进场遮罩 / 全屏解锁 AudioContext -->
    <div id="intro-overlay">
        <div class="intro-content">
            <h1 class="glitch-text" data-text="DREAMY VOYAGE">DREAMY VOYAGE</h1>
            <div class="glow-pulse"><i class="fa-solid fa-hand-point-up"></i></div>
        </div>
    </div>


    <!-- 主容器 -->
    <div id="app" class="hidden">
        <!-- 侧边歌单抽屉 -->
        <div id="drawer-overlay"></div>
        <div id="songs-drawer">
            <div class="drawer-header">
                <h3><i class="fa-solid fa-list-music"></i> 歌单目录</h3>
                <button id="close-drawer-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="song-list" class="song-list-container">
                <!-- 歌曲列表动态渲染 -->
            </div>
        </div>

        <!-- 卡片式播放器核心 -->
        <main id="player-container">
            <div class="player-card">
                <!-- 专辑封面区域 -->
                <div class="cover-wrapper">
                    <img id="cover-img" src="./cover.png" alt="DreamyVoyage Cover">
                    <div class="glow-ring"></div>
                </div>

                <!-- 歌曲信息区 -->
                <div class="song-info">
                    <h2 id="song-title">载入中...</h2>
                    <p id="album-title">Album: DreamyVoyage</p>
                </div>

                <!-- 进度条区 -->
                <div class="progress-bar-wrapper">
                    <span id="current-time">0:00</span>
                    <div class="progress-track" id="progress-track">
                        <div class="progress-fill" id="progress-fill"></div>
                        <div class="progress-handle"></div>
                    </div>
                    <span id="duration-time">0:00</span>
                </div>

                <!-- 操控功能区 -->
                <div class="controls">
                    <button class="btn-ctrl" id="btn-list" title="歌单"><i class="fa-solid fa-bars"></i></button>
                    <button class="btn-ctrl" id="btn-prev" title="上一首"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="btn-ctrl btn-play" id="btn-play-pause" title="播放"><i class="fa-solid fa-play"></i></button>
                    <button class="btn-ctrl" id="btn-next" title="下一首"><i class="fa-solid fa-forward-step"></i></button>
                    <button class="btn-ctrl" id="btn-share" title="分享海报"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
                </div>

                <!-- 社交平台直达及页脚 -->
                <div class="social-links">
                    <a href="https://music.163.com/#/artist/album?id=98388237" target="_blank" class="social-icon netease" title="网易云音乐">
                        <i class="fa-solid fa-cloud"></i>
                    </a>
                    <a href="https://open.spotify.com/album/5PZ8atoSio9I3XfTgNFSDI" target="_blank" class="social-icon spotify" title="Spotify">
                        <i class="fa-brands fa-spotify"></i>
                    </a>
                    <a href="mailto:Echos@Dreamy.Voyage" class="social-icon mail" title="Email: Echos@Dreamy.Voyage">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                </div>
                <div class="footer-copyright">
                    &copy; 2026 虚空造物 (FFTV). All Rights Reserved.
                </div>
            </div>
        </main>

        <!-- 微信分享海报弹窗 Overlay -->
        <div id="share-modal" class="hidden-modal">
            <div class="modal-backdrop"></div>
            <div class="modal-box">
                <button id="close-modal-btn"><i class="fa-solid fa-circle-xmark"></i></button>
                <div id="poster-container">
                    <!-- 这里动态插入生成的带二维码的海报 <img> 供用户长按保存 -->
                </div>
                <p class="share-hint">↑ 长按图片保存或分享至微信 ↑</p>
            </div>
        </div>
    </div>

    <!-- 基础音频 & 脚本引入 -->
    <script src="./song-list.js"></script>
    <audio id="audio-core" preload="auto"></audio>
    <script src="./main.js"></script>
</body>
</html>
