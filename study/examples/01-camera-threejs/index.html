<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js 相机控制</title>
  <style>
    body { margin: 0; background: #0b1020; color: #eef; font-family: Consolas, monospace; }
    #container { width: 100vw; height: 100vh; }
    .info { position: absolute; top: 10px; left: 10px; z-index: 100; }
    .controls { position: absolute; bottom: 10px; left: 10px; z-index: 100; }
  </style>
</head>
<body>
  <div class="info">Three.js 相机控制 - 拖拽旋转，滚轮缩放</div>
  <div class="controls">
    鼠标拖拽：旋转视角 | 滚轮：缩放 | 右键拖拽：平移
  </div>
  <div id="container"></div>

  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // 场景、相机、渲染器
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x0b1020);
    document.getElementById('container').appendChild(renderer.domElement);

    // 创建多个立方体
    const cubes = [];
    const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff];
    
    for (let i = 0; i < 6; i++) {
      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const material = new THREE.MeshBasicMaterial({ color: colors[i] });
      const cube = new THREE.Mesh(geometry, material);
      
      // 排列立方体
      cube.position.x = (i % 3 - 1) * 3;
      cube.position.y = Math.floor(i / 3) * 3 - 1.5;
      cube.position.z = 0;
      
      scene.add(cube);
      cubes.push(cube);
    }

    // 添加光源
    const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 5, 5);
    scene.add(directionalLight);

    // 设置相机位置
    camera.position.set(5, 5, 5);
    camera.lookAt(0, 0, 0);

    // 添加轨道控制器
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 动画循环
    function animate() {
      requestAnimationFrame(animate);
      
      // 旋转所有立方体
      cubes.forEach((cube, index) => {
        cube.rotation.x += 0.01 * (index + 1);
        cube.rotation.y += 0.01 * (index + 1);
      });
      
      controls.update();
      renderer.render(scene, camera);
    }

    // 窗口大小调整
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
