<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js 车辆驾驶</title>
  <style>
    body { margin: 0; background: #0b1020; color: #eef; font-family: Consolas, monospace; }
    #container { width: 100vw; height: 100vh; }
    .info { position: absolute; top: 10px; left: 10px; z-index: 100; }
    .controls { position: absolute; bottom: 10px; left: 10px; z-index: 100; }
  </style>
</head>
<body>
  <div class="info">Three.js 车辆驾驶 - W/S 前进后退，A/D 转向</div>
  <div class="controls">
    控制：W/S 前进后退 | A/D 转向 | 鼠标拖拽：旋转视角
  </div>
  <div id="container"></div>

  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // 场景、相机、渲染器
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x0b1020);
    document.getElementById('container').appendChild(renderer.domElement);

    // 车辆状态
    const car = {
      position: new THREE.Vector3(0, 0, 0),
      rotation: 0,
      velocity: 0,
      maxSpeed: 0.2,
      acceleration: 0.01,
      friction: 0.95,
      turnSpeed: 0.05
    };

    // 输入状态
    const keys = {
      w: false, s: false, a: false, d: false
    };

    // 创建车辆
    const carGroup = new THREE.Group();
    
    // 车身
    const bodyGeometry = new THREE.BoxGeometry(2, 0.5, 4);
    const bodyMaterial = new THREE.MeshLambertMaterial({ color: 0xff6b6b });
    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
    body.position.y = 0.5;
    carGroup.add(body);

    // 车轮
    const wheelGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 8);
    const wheelMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 });
    
    const wheels = [];
    const wheelPositions = [
      [-0.8, 0.2, 1.2], [0.8, 0.2, 1.2],
      [-0.8, 0.2, -1.2], [0.8, 0.2, -1.2]
    ];
    
    wheelPositions.forEach(pos => {
      const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
      wheel.position.set(pos[0], pos[1], pos[2]);
      wheel.rotation.z = Math.PI / 2;
      carGroup.add(wheel);
      wheels.push(wheel);
    });

    carGroup.position.copy(car.position);
    scene.add(carGroup);

    // 创建地面
    const groundGeometry = new THREE.PlaneGeometry(100, 100);
    const groundMaterial = new THREE.MeshLambertMaterial({ 
      color: 0x4a90e2,
      side: THREE.DoubleSide
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 添加一些障碍物
    for (let i = 0; i < 10; i++) {
      const obstacleGeometry = new THREE.BoxGeometry(1, 2, 1);
      const obstacleMaterial = new THREE.MeshLambertMaterial({ 
        color: Math.random() * 0xffffff 
      });
      const obstacle = new THREE.Mesh(obstacleGeometry, obstacleMaterial);
      obstacle.position.set(
        (Math.random() - 0.5) * 40,
        1,
        (Math.random() - 0.5) * 40
      );
      scene.add(obstacle);
    }

    // 添加光源
    const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(10, 10, 5);
    scene.add(directionalLight);

    // 设置相机位置
    camera.position.set(0, 8, 10);
    camera.lookAt(0, 0, 0);

    // 添加轨道控制器
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);

    // 键盘事件
    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (key in keys) keys[key] = true;
    });

    document.addEventListener('keyup', (event) => {
      const key = event.key.toLowerCase();
      if (key in keys) keys[key] = false;
    });

    // 车辆更新函数
    function updateCar() {
      // 前进后退
      if (keys.w) {
        car.velocity = Math.min(car.velocity + car.acceleration, car.maxSpeed);
      } else if (keys.s) {
        car.velocity = Math.max(car.velocity - car.acceleration, -car.maxSpeed);
      } else {
        car.velocity *= car.friction;
      }

      // 转向
      if (keys.a && Math.abs(car.velocity) > 0.01) {
        car.rotation -= car.turnSpeed * Math.abs(car.velocity) / car.maxSpeed;
      }
      if (keys.d && Math.abs(car.velocity) > 0.01) {
        car.rotation += car.turnSpeed * Math.abs(car.velocity) / car.maxSpeed;
      }

      // 更新位置
      car.position.x += Math.sin(car.rotation) * car.velocity;
      car.position.z += Math.cos(car.rotation) * car.velocity;

      // 更新车辆位置和旋转
      carGroup.position.copy(car.position);
      carGroup.rotation.y = car.rotation;

      // 旋转车轮
      wheels.forEach((wheel, index) => {
        wheel.rotation.x += car.velocity * 0.1;
        if (index < 2) { // 前轮转向
          wheel.rotation.y = (keys.a ? -0.3 : 0) + (keys.d ? 0.3 : 0);
        }
      });

      // 相机跟随
      const cameraOffset = new THREE.Vector3(
        Math.sin(car.rotation) * -8,
        5,
        Math.cos(car.rotation) * -8
      );
      camera.position.copy(car.position).add(cameraOffset);
      camera.lookAt(car.position);
      controls.target.copy(car.position);
    }

    // 动画循环
    function animate() {
      requestAnimationFrame(animate);
      
      updateCar();
      controls.update();
      renderer.render(scene, camera);
    }

    // 窗口大小调整
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
