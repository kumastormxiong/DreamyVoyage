<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js 动态地形</title>
  <style>
    body { margin: 0; background: #0b1020; color: #eef; font-family: Consolas, monospace; }
    #container { width: 100vw; height: 100vh; }
    .info { position: absolute; top: 10px; left: 10px; z-index: 100; }
  </style>
</head>
<body>
  <div class="info">Three.js 动态地形 - 程序化生成波动地形</div>
  <div id="container"></div>

  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // 场景、相机、渲染器
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x0b1020);
    document.getElementById('container').appendChild(renderer.domElement);

    // 创建地形几何体
    const size = 50;
    const segments = 100;
    const geometry = new THREE.PlaneGeometry(size, size, segments, segments);
    
    // 获取顶点位置
    const positions = geometry.attributes.position.array;
    const originalPositions = [...positions];
    
    // 创建材质
    const material = new THREE.MeshLambertMaterial({ 
      color: 0x4a90e2,
      side: THREE.DoubleSide,
      wireframe: false
    });
    
    const terrain = new THREE.Mesh(geometry, material);
    scene.add(terrain);

    // 添加光源
    const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(10, 10, 5);
    scene.add(directionalLight);

    // 设置相机位置
    camera.position.set(20, 20, 20);
    camera.lookAt(0, 0, 0);

    // 添加轨道控制器
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 地形动画函数
    function updateTerrain(time) {
      for (let i = 0; i < positions.length; i += 3) {
        const x = originalPositions[i];
        const z = originalPositions[i + 2];
        
        // 使用正弦波创建波动效果
        const wave1 = Math.sin(x * 0.1 + time * 0.001) * 2;
        const wave2 = Math.sin(z * 0.1 + time * 0.0015) * 1.5;
        const wave3 = Math.sin((x + z) * 0.05 + time * 0.002) * 1;
        
        positions[i + 1] = wave1 + wave2 + wave3;
      }
      
      geometry.attributes.position.needsUpdate = true;
      
      // 根据高度更新颜色
      const colors = [];
      for (let i = 0; i < positions.length; i += 3) {
        const height = positions[i + 1];
        const normalizedHeight = (height + 5) / 10; // 归一化到 0-1
        
        // 从蓝色到绿色的渐变
        const color = new THREE.Color();
        color.setHSL(0.6 - normalizedHeight * 0.3, 0.8, 0.3 + normalizedHeight * 0.4);
        colors.push(color.r, color.g, color.b);
      }
      
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      material.vertexColors = true;
    }

    // 动画循环
    function animate() {
      requestAnimationFrame(animate);
      
      const time = Date.now();
      updateTerrain(time);
      
      controls.update();
      renderer.render(scene, camera);
    }

    // 窗口大小调整
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
