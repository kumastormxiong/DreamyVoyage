<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>自动驾驶游戏 - Three.js + WebGPU</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>
  <div id="game-container">
    <div id="ui-overlay">
      <div class="hud">
        <div class="hud-item">
          <span class="label">速度:</span>
          <span id="speed">0</span> km/h
        </div>
        <div class="hud-item">
          <span class="label">FPS:</span>
          <span id="fps">0</span>
        </div>
        <div class="hud-item">
          <span class="label">距离:</span>
          <span id="distance">0</span> m
        </div>
      </div>
      
      <div class="controls-info">
        <div>自动驾驶模式</div>
        <div>按 SPACE 切换手动/自动</div>
        <div>WASD 手动控制</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
  <script src="js/terrain-generator.js"></script>
  <script src="js/road-generator.js"></script>
  <script src="js/vehicle-controller.js"></script>
  <script src="js/autopilot.js"></script>
  <script src="js/game-engine.js"></script>
</body>
</html>
