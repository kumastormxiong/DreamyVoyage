<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>简化自动驾驶游戏</title>
  <style>
    body { margin: 0; padding: 0; background: #0a0a0a; font-family: Arial, sans-serif; overflow: hidden; }
    #game-container { position: relative; width: 100vw; height: 100vh; }
    #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
    .hud { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; color: #fff; }
    .controls { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; color: #fff; text-align: center; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-overlay">
      <div class="hud">
        <div>速度: <span id="speed">0</span> km/h</div>
        <div>FPS: <span id="fps">0</span></div>
        <div>距离: <span id="distance">0</span> m</div>
        <div>模式: <span id="mode">手动</span></div>
      </div>
      <div class="controls">
        <div>WASD - 手动控制</div>
        <div>空格 - 切换自动驾驶</div>
        <div>鼠标 - 旋转视角</div>
      </div>
    </div>
  </div>

  <script>
    // 简化的自动驾驶游戏
    class SimpleGame {
      constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        
        // 游戏状态
        this.car = { x: 0, y: 0, angle: 0, speed: 0, maxSpeed: 0.3 };
        this.camera = { x: 0, y: 0, zoom: 1 };
        this.road = [];
        this.autopilot = false;
        this.keys = { w: false, s: false, a: false, d: false };
        this.mouse = { x: 0, y: 0, down: false };
        
        this.fps = 0;
        this.frameCount = 0;
        this.lastTime = 0;
        this.distance = 0;
        this.lastPos = { x: 0, y: 0 };
        
        this.generateRoad();
        this.setupEvents();
        this.gameLoop();
      }
      
      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }
      
      generateRoad() {
        // 生成蜿蜒的道路
        this.road = [];
        let x = 0, y = 0, angle = 0;
        
        for (let i = 0; i < 100; i++) {
          this.road.push({ x, y });
          
          // 随机改变方向
          angle += (Math.random() - 0.5) * 0.3;
          const step = 20;
          x += Math.sin(angle) * step;
          y += Math.cos(angle) * step;
        }
      }
      
      setupEvents() {
        // 键盘事件
        document.addEventListener('keydown', (e) => {
          const key = e.key.toLowerCase();
          if (key in this.keys) this.keys[key] = true;
          if (key === ' ') {
            e.preventDefault();
            this.autopilot = !this.autopilot;
            document.getElementById('mode').textContent = this.autopilot ? '自动' : '手动';
          }
        });
        
        document.addEventListener('keyup', (e) => {
          const key = e.key.toLowerCase();
          if (key in this.keys) this.keys[key] = false;
        });
        
        // 鼠标事件
        this.canvas.addEventListener('mousedown', (e) => {
          this.mouse.down = true;
        });
        
        this.canvas.addEventListener('mouseup', (e) => {
          this.mouse.down = false;
        });
        
        this.canvas.addEventListener('mousemove', (e) => {
          this.mouse.x = e.clientX;
          this.mouse.y = e.clientY;
        });
        
        window.addEventListener('resize', () => this.resize());
      }
      
      update() {
        // 更新车辆
        if (this.autopilot) {
          this.updateAutopilot();
        } else {
          this.updateManual();
        }
        
        // 更新相机
        this.camera.x = this.car.x;
        this.camera.y = this.car.y;
        
        // 更新UI
        this.updateUI();
      }
      
      updateManual() {
        // 手动控制
        if (this.keys.w) {
          this.car.speed = Math.min(this.car.speed + 0.01, this.car.maxSpeed);
        } else if (this.keys.s) {
          this.car.speed = Math.max(this.car.speed - 0.01, -this.car.maxSpeed * 0.5);
        } else {
          this.car.speed *= 0.95;
        }
        
        if (this.keys.a && Math.abs(this.car.speed) > 0.01) {
          this.car.angle -= 0.05 * (this.car.speed / this.car.maxSpeed);
        }
        if (this.keys.d && Math.abs(this.car.speed) > 0.01) {
          this.car.angle += 0.05 * (this.car.speed / this.car.maxSpeed);
        }
        
        this.car.x += Math.sin(this.car.angle) * this.car.speed;
        this.car.y += Math.cos(this.car.angle) * this.car.speed;
      }
      
      updateAutopilot() {
        // 自动驾驶 - 找到最近的道路点
        let closestIndex = 0;
        let closestDist = Infinity;
        
        for (let i = 0; i < this.road.length; i++) {
          const point = this.road[i];
          const dist = Math.sqrt((point.x - this.car.x) ** 2 + (point.y - this.car.y) ** 2);
          if (dist < closestDist) {
            closestDist = dist;
            closestIndex = i;
          }
        }
        
        // 获取目标点（前瞻）
        const targetIndex = Math.min(closestIndex + 3, this.road.length - 1);
        const target = this.road[targetIndex];
        
        // 计算转向角度
        const dx = target.x - this.car.x;
        const dy = target.y - this.car.y;
        const targetAngle = Math.atan2(dx, dy);
        
        let angleDiff = targetAngle - this.car.angle;
        while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
        while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
        
        // 应用转向
        this.car.angle += angleDiff * 0.1;
        this.car.speed = Math.min(this.car.speed + 0.005, this.car.maxSpeed);
        
        this.car.x += Math.sin(this.car.angle) * this.car.speed;
        this.car.y += Math.cos(this.car.angle) * this.car.speed;
      }
      
      updateUI() {
        // 计算FPS
        this.frameCount++;
        const now = performance.now();
        if (now - this.lastTime >= 1000) {
          this.fps = this.frameCount;
          this.frameCount = 0;
          this.lastTime = now;
        }
        
        // 计算距离
        const dist = Math.sqrt((this.car.x - this.lastPos.x) ** 2 + (this.car.y - this.lastPos.y) ** 2);
        this.distance += dist;
        this.lastPos = { x: this.car.x, y: this.car.y };
        
        // 更新显示
        document.getElementById('fps').textContent = this.fps;
        document.getElementById('speed').textContent = Math.round(Math.abs(this.car.speed) * 100);
        document.getElementById('distance').textContent = Math.round(this.distance);
      }
      
      render() {
        const ctx = this.ctx;
        const width = this.canvas.width;
        const height = this.canvas.height;
        
        // 清空画布
        ctx.fillStyle = '#87CEEB';
        ctx.fillRect(0, 0, width, height);
        
        // 设置变换矩阵
        ctx.save();
        ctx.translate(width / 2, height / 2);
        ctx.scale(this.camera.zoom, this.camera.zoom);
        ctx.translate(-this.camera.x, -this.camera.y);
        
        // 绘制地形网格
        this.drawTerrain(ctx);
        
        // 绘制道路
        this.drawRoad(ctx);
        
        // 绘制车辆
        this.drawCar(ctx);
        
        ctx.restore();
      }
      
      drawTerrain(ctx) {
        // 简单的网格地形
        ctx.strokeStyle = '#4a90e2';
        ctx.lineWidth = 1;
        
        const gridSize = 50;
        const startX = Math.floor(this.camera.x / gridSize) * gridSize - gridSize;
        const startY = Math.floor(this.camera.y / gridSize) * gridSize - gridSize;
        const endX = startX + (width / this.camera.zoom) + gridSize * 2;
        const endY = startY + (height / this.camera.zoom) + gridSize * 2;
        
        for (let x = startX; x < endX; x += gridSize) {
          ctx.beginPath();
          ctx.moveTo(x, startY);
          ctx.lineTo(x, endY);
          ctx.stroke();
        }
        
        for (let y = startY; y < endY; y += gridSize) {
          ctx.beginPath();
          ctx.moveTo(startX, y);
          ctx.lineTo(endX, y);
          ctx.stroke();
        }
      }
      
      drawRoad(ctx) {
        if (this.road.length < 2) return;
        
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        ctx.beginPath();
        ctx.moveTo(this.road[0].x, this.road[0].y);
        
        for (let i = 1; i < this.road.length; i++) {
          ctx.lineTo(this.road[i].x, this.road[i].y);
        }
        
        ctx.stroke();
      }
      
      drawCar(ctx) {
        ctx.save();
        ctx.translate(this.car.x, this.car.y);
        ctx.rotate(this.car.angle);
        
        // 车身
        ctx.fillStyle = '#ff4757';
        ctx.fillRect(-8, -15, 16, 30);
        
        // 车轮
        ctx.fillStyle = '#333';
        ctx.fillRect(-6, -12, 4, 6);
        ctx.fillRect(2, -12, 4, 6);
        ctx.fillRect(-6, 6, 4, 6);
        ctx.fillRect(2, 6, 4, 6);
        
        ctx.restore();
      }
      
      gameLoop() {
        this.update();
        this.render();
        requestAnimationFrame(() => this.gameLoop());
      }
    }
    
    // 启动游戏
    window.addEventListener('DOMContentLoaded', () => {
      new SimpleGame();
    });
  </script>
</body>
</html>
