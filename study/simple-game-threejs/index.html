<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js 完整驾驶游戏</title>
  <style>
    body { margin: 0; background: #0b1020; color: #eef; font-family: Consolas, monospace; }
    #container { width: 100vw; height: 100vh; }
    .info { position: absolute; top: 10px; left: 10px; z-index: 100; }
    .controls { position: absolute; bottom: 10px; left: 10px; z-index: 100; }
    .hud { position: absolute; top: 10px; right: 10px; z-index: 100; }
  </style>
</head>
<body>
  <div class="info">Three.js 完整驾驶游戏 - 地形+车辆+音频</div>
  <div class="controls">
    控制：W/S 前进后退 | A/D 转向 | M 静音 | N 下一曲
  </div>
  <div class="hud">
    <div>FPS: <span id="fps">0</span></div>
    <div>速度: <span id="speed">0</span> km/h</div>
  </div>
  <div id="container"></div>

  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script>
    // 场景、相机、渲染器
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x87CEEB);
    document.getElementById('container').appendChild(renderer.domElement);

    // 车辆状态
    const car = {
      position: new THREE.Vector3(0, 0, 0),
      rotation: 0,
      velocity: 0,
      maxSpeed: 0.3,
      acceleration: 0.015,
      friction: 0.92,
      turnSpeed: 0.08
    };

    // 输入状态
    const keys = {
      w: false, s: false, a: false, d: false, m: false, n: false
    };

    // 音频状态
    let audio, playlist = [], currentTrack = 0, muted = false;

    // 创建车辆
    const carGroup = new THREE.Group();
    
    // 车身
    const bodyGeometry = new THREE.BoxGeometry(1.5, 0.6, 3);
    const bodyMaterial = new THREE.MeshLambertMaterial({ color: 0xff4757 });
    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
    body.position.y = 0.6;
    carGroup.add(body);

    // 车轮
    const wheelGeometry = new THREE.CylinderGeometry(0.25, 0.25, 0.15, 8);
    const wheelMaterial = new THREE.MeshLambertMaterial({ color: 0x2c2c2c });
    
    const wheels = [];
    const wheelPositions = [
      [-0.6, 0.25, 1], [0.6, 0.25, 1],
      [-0.6, 0.25, -1], [0.6, 0.25, -1]
    ];
    
    wheelPositions.forEach(pos => {
      const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
      wheel.position.set(pos[0], pos[1], pos[2]);
      wheel.rotation.z = Math.PI / 2;
      carGroup.add(wheel);
      wheels.push(wheel);
    });

    carGroup.position.copy(car.position);
    scene.add(carGroup);

    // 创建程序化地形
    const terrainSize = 200;
    const terrainSegments = 100;
    const terrainGeometry = new THREE.PlaneGeometry(terrainSize, terrainSize, terrainSegments, terrainSegments);
    
    // 生成地形高度
    const positions = terrainGeometry.attributes.position.array;
    for (let i = 0; i < positions.length; i += 3) {
      const x = positions[i];
      const z = positions[i + 2];
      
      // 使用多个噪声层创建复杂地形
      let height = 0;
      height += Math.sin(x * 0.01) * Math.cos(z * 0.01) * 3;
      height += Math.sin(x * 0.02) * Math.cos(z * 0.02) * 1.5;
      height += Math.sin(x * 0.05) * Math.cos(z * 0.05) * 0.5;
      height += Math.random() * 0.3;
      
      positions[i + 1] = height;
    }
    
    terrainGeometry.attributes.position.needsUpdate = true;
    terrainGeometry.computeVertexNormals();

    // 根据高度设置颜色
    const colors = [];
    for (let i = 0; i < positions.length; i += 3) {
      const height = positions[i + 1];
      let color;
      
      if (height > 2) {
        color = new THREE.Color(0x8B4513); // 棕色 - 高山
      } else if (height > 0) {
        color = new THREE.Color(0x228B22); // 绿色 - 草地
      } else {
        color = new THREE.Color(0x4169E1); // 蓝色 - 水面
      }
      
      colors.push(color.r, color.g, color.b);
    }
    terrainGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const terrainMaterial = new THREE.MeshLambertMaterial({ 
      vertexColors: true,
      side: THREE.DoubleSide
    });
    const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
    terrain.rotation.x = -Math.PI / 2;
    scene.add(terrain);

    // 添加一些树木
    for (let i = 0; i < 50; i++) {
      const treeGroup = new THREE.Group();
      
      // 树干
      const trunkGeometry = new THREE.CylinderGeometry(0.1, 0.2, 2);
      const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
      const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
      trunk.position.y = 1;
      treeGroup.add(trunk);
      
      // 树叶
      const leavesGeometry = new THREE.SphereGeometry(1, 8, 6);
      const leavesMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
      const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
      leaves.position.y = 2.5;
      treeGroup.add(leaves);
      
      // 随机位置
      treeGroup.position.set(
        (Math.random() - 0.5) * terrainSize * 0.8,
        0,
        (Math.random() - 0.5) * terrainSize * 0.8
      );
      
      scene.add(treeGroup);
    }

    // 添加光源
    const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(50, 50, 25);
    scene.add(directionalLight);

    // 设置相机位置
    camera.position.set(0, 10, 15);
    camera.lookAt(0, 0, 0);

    // 简单的相机控制（不使用 OrbitControls）
    let mouseX = 0, mouseY = 0;
    let isMouseDown = false;
    
    document.addEventListener('mousedown', (e) => {
      isMouseDown = true;
    });
    
    document.addEventListener('mouseup', (e) => {
      isMouseDown = false;
    });
    
    document.addEventListener('mousemove', (e) => {
      if (isMouseDown) {
        mouseX += (e.movementX || 0) * 0.01;
        mouseY += (e.movementY || 0) * 0.01;
        mouseY = Math.max(-Math.PI/2, Math.min(Math.PI/2, mouseY));
      }
    });

    // 键盘事件
    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (key in keys) {
        keys[key] = true;
        if (key === 'm') {
          muted = !muted;
          if (audio) audio.muted = muted;
        }
        if (key === 'n') {
          nextTrack();
        }
      }
    });

    document.addEventListener('keyup', (event) => {
      const key = event.key.toLowerCase();
      if (key in keys) keys[key] = false;
    });

    // 音频系统
    async function initAudio() {
      try {
        const response = await fetch('/song-list.json');
        playlist = await response.json();
      } catch (e) {
        console.log('无法加载音乐列表，使用默认列表');
        playlist = [
          '01-幻梦之旅-Dreamy Voyage.mp3',
          '02-某日-Another Day.mp3',
          '03-前夜-The Eve.mp3'
        ];
      }
      
      audio = new Audio();
      audio.loop = false;
      audio.volume = 0.7;
      audio.muted = muted;
      audio.addEventListener('ended', nextTrack);
      
      if (playlist.length > 0) {
        nextTrack();
      }
    }

    function nextTrack() {
      if (!audio || playlist.length === 0) return;
      
      currentTrack = (currentTrack + 1) % playlist.length;
      audio.src = '/mp3s/' + playlist[currentTrack];
      audio.play().catch(() => {
        console.log('音频播放需要用户交互');
      });
    }

    // 车辆更新函数
    function updateCar() {
      // 前进后退
      if (keys.w) {
        car.velocity = Math.min(car.velocity + car.acceleration, car.maxSpeed);
      } else if (keys.s) {
        car.velocity = Math.max(car.velocity - car.acceleration, -car.maxSpeed);
      } else {
        car.velocity *= car.friction;
      }

      // 转向
      if (keys.a && Math.abs(car.velocity) > 0.01) {
        car.rotation -= car.turnSpeed * Math.abs(car.velocity) / car.maxSpeed;
      }
      if (keys.d && Math.abs(car.velocity) > 0.01) {
        car.rotation += car.turnSpeed * Math.abs(car.velocity) / car.maxSpeed;
      }

      // 更新位置
      car.position.x += Math.sin(car.rotation) * car.velocity;
      car.position.z += Math.cos(car.rotation) * car.velocity;

      // 更新车辆位置和旋转
      carGroup.position.copy(car.position);
      carGroup.rotation.y = car.rotation;

      // 旋转车轮
      wheels.forEach((wheel, index) => {
        wheel.rotation.x += car.velocity * 0.2;
        if (index < 2) { // 前轮转向
          wheel.rotation.y = (keys.a ? -0.3 : 0) + (keys.d ? 0.3 : 0);
        }
      });

      // 相机跟随
      const cameraOffset = new THREE.Vector3(
        Math.sin(car.rotation) * -12,
        8,
        Math.cos(car.rotation) * -12
      );
      camera.position.copy(car.position).add(cameraOffset);
      camera.lookAt(car.position);
      controls.target.copy(car.position);
    }

    // FPS 计算
    let frameCount = 0;
    let lastTime = performance.now();
    function updateFPS() {
      frameCount++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        document.getElementById('fps').textContent = frameCount;
        frameCount = 0;
        lastTime = now;
      }
    }

    // 更新 HUD
    function updateHUD() {
      const speed = Math.abs(car.velocity) * 100;
      document.getElementById('speed').textContent = Math.round(speed);
    }

    // 动画循环
    function animate() {
      requestAnimationFrame(animate);
      
      updateCar();
      updateFPS();
      updateHUD();
      controls.update();
      renderer.render(scene, camera);
    }

    // 窗口大小调整
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 初始化
    initAudio();
    animate();
  </script>
</body>
</html>
